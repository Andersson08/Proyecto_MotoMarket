{% extends "base.html" %}
{% load static %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row align-items-center g-5">
    <div class="col-lg-5 d-none d-lg-block">
      <div class="hero-moto">
        <span class="texto-gigante">JOIN</span>
        <img src="{% static 'img/motos/final/mt03.webp' %}" alt="">
      </div>
    </div>
    <div class="col-lg-6 offset-lg-1">
      <div class="panel p-4 p-md-5">
        <h1 class="h2 mb-1">Crear cuenta</h1>
        <p class="text-secondary small mb-4">Regístrate para comprar tu moto en línea.</p>
        <form method="post">{% csrf_token %}
          {% include "includes/form.html" %}
          <button class="btn btn-verde w-100 mt-2">Registrarme</button>
        </form>
        <p class="small mt-4 mb-0 text-secondary">¿Ya tienes cuenta? <a href="{% url 'usuarios:login' %}">Ingresa</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
