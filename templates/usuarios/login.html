{% extends "base.html" %}
{% load static %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row align-items-center g-5">
    <div class="col-lg-6 d-none d-lg-block">
      <div class="hero-moto">
        <span class="texto-gigante">RIDE</span>
        <img src="{% static 'img/motos/final/duke390.webp' %}" alt="">
      </div>
    </div>
    <div class="col-lg-5 offset-lg-1">
      <div class="panel p-4 p-md-5">
        <h1 class="h2 mb-1">Ingresar</h1>
        <p class="text-secondary small mb-4">Accede para comprar y agendar pruebas de manejo.</p>
        <form method="post">{% csrf_token %}
          {% include "includes/form.html" %}
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-verde w-100 mt-2">Ingresar</button>
        </form>
        <p class="small mt-4 mb-0 text-secondary">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
