services:
  - type: web
    name: motomarket
    runtime: python
    region: ohio
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn motomarket.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: motomarket-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: motomarket-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_DOCS_URL
        value: https://motomarket-auip.onrender.com/api/docs/
    routes:
      - type: rewrite
        source: /api/*
        destination: https://motomarket-auip.onrender.com/api/*
      - type: rewrite
        source: /static/*
        destination: https://motomarket-auip.onrender.com/static/*
      - type: rewrite
        source: /media/*
        destination: https://motomarket-auip.onrender.com/media/*
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

databases:
  - name: motomarket-db
    plan: free
    region: ohio
    databaseName: motomarket
    user: motomarket
